services:
  db:
    image: postgres:16-alpine
    container_name: mock_erp_postgres
    restart: always
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: mock_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d mock_erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
